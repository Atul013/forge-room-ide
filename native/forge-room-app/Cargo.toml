[package]
name = "forge-room-app"
version = "0.110.0-alpha.3"
edition = "2024"
license = "MIT"
description = "Native graphical Forge Room Early Preview shell"

[dependencies]
forge-room-core = { package = "forge-room-early-preview", path = "../forge-room-core" }
rfd = "0.15"
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kurbo = "0.11"
fancy-regex = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "wgpu"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "forge-room-early-preview"
path = "src/main.rs"
