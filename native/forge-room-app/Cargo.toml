[package]
name = "forge-room-app"
version = "0.110.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Native graphical Forge Room Early Preview shell"

[dependencies]
forge-room-core = { package = "forge-room-early-preview", path = "../forge-room-core" }
rfd = "0.15"
portable-pty = "0.9"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kurbo = "0.11"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "forge-room-early-preview"
path = "src/main.rs"
