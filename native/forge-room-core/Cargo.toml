[package]
name = "forge-room-early-preview"
version = "0.110.0-alpha.3"
edition = "2021"
license = "MIT"
description = "Editor-independent native Forge Room domain slice"
default-run = "forge-room-preview"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[lib]
name = "forge_room_core"
path = "src/lib.rs"

[[bin]]
name = "forge-room-preview"
path = "src/main.rs"
